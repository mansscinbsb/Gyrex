<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="cart.pageTitle">Shopping Cart — GYREX</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell cart-shell">
    <main class="cart-page">
      <a class="icon-button menu-control menu-close cart-close" href="index.html" data-language-link
        aria-label="Close cart and return to home" data-i18n-aria-label="cart.close">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="menu-line menu-line-top" d="M3 12h18"/>
          <path class="menu-line menu-line-middle" d="M3 12h18"/>
          <path class="menu-line menu-line-bottom" d="M3 12h18"/>
        </svg>
      </a>
      <h1 class="cart-title" data-i18n="cart.title">Shopping Cart</h1>
      <p class="cart-empty" data-i18n="cart.empty">Your cart is empty.</p>
      <a class="cart-back" href="index.html" data-language-link data-i18n="cart.back">Back to catalog</a>
    </main>
  </div>

  <script src="language.js" defer></script>
</body>
</html>
